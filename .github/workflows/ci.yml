name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Ruff
        run: uv run --extra dev ruff check .

      - name: Type check
        run: uv run --extra dev ty check

      - name: Tests
        run: uv run --extra dev pytest
