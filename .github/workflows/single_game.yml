name: Get Single Game

on:
    workflow_dispatch:
      inputs:
        game_id:
          description: 'Game ID'
          required: true

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      # zizmor: ignore[artipacked] credentials are needed to push the committed database
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script to generate SQLite database
      env:
        GAME_ID: ${{ github.event.inputs.game_id }}
      run: python program.py --game_id "$GAME_ID"

    - name: Commit and push if it changed
      env:
        GAME_ID: ${{ github.event.inputs.game_id }}
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "🗃️ Add Single Game: $GAME_ID" || exit 0
        git push
